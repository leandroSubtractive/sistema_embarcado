[versions]
agp = "8.13.0"
core = "1.7.0"
coreTesting = "2.2.0"
espressoCore = "3.7.0"
junit = "1.3.0"
junitBom = "5.10.0"
kotlin = "2.0.21"
coreKtx = "1.17.0"
appcompat = "1.7.1"
